    <path d="M 152 46 C 168 55 184 80 174 112 C 164 94 156 76 152 46 Z" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"/>

    <path d="M 144 65 C 120 72 100 98 108 126 C 122 115 134 100 144 80" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 156 65 C 180 72 200 98 192 126 C 178 115 166 100 156 80" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"/>

    <path d="M 136 90 C 104 95 82 118 90 140 C 108 135 125 124 138 112" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 164 90 C 196 95 218 118 210 140 C 192 135 175 124 162 112" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"/>

    <path d="M 120 128 C 96 138 88 152 104 160 C 124 154 138 142 146 132" fill="none" stroke="url(#splashGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 180 128 C 204 138 212 152 196 160 C 176 154 162 142 154 132" fill="none" stroke="url(#splashGold)" stroke-width="2.5" stroke-linecap="round"/>
    
    <path d="M 138 135 C 146 142 154 142 162 135" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-linecap="round"/>
