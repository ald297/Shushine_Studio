      <stop offset="35%" stop-color="#E5C778"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="splashPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6DF"/>
      <stop offset="100%" stop-color="#E87A90"/>
