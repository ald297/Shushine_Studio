    <!-- 'S' inside Center Petal -->
    <path d="M 156 58 C 153 52 147 52 145 56 C 143 60 146 64 153 68 C 158 71 161 76 159 82 C 156 90 145 92 142 86 M 143 85 C 145 88 152 88 154 84 C 156 80 152 76 146 72 C 141 68 139 63 142 57 C 145 50 155 49 158 54" 
