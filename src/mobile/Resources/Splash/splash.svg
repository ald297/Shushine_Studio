  <!-- Typography: SHUNSHINE STUDIO -->
  <text x="64" y="112" 
        text-anchor="middle" 
        font-family="'Playfair Display', serif" 
        font-size="11" 
        font-weight="bold" 
        letter-spacing="2" 
        fill="#9B2D47">SHUNSHINE</text>
  <text x="64" y="122" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
