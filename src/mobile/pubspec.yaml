name: shushine_studio_mobile
description: "Aplicación móvil oficial de gestión y reservas para Shushine Studio"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Networking & Security
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.5.6

  # UI, Icons, Calendar & Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
