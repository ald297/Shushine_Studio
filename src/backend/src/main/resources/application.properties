# ==============================================================================
# CONFIGURACIÓN OFICIAL DE SHUSHINE STUDIO API (SPRING BOOT 3.3.3)
# ==============================================================================
spring.application.name=ShushineStudioAPI
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# BASE DE DATOS: SUPABASE POSTGRESQL (AWS POOLER DIRECTO)
# ------------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.acikahicfjtojuvqcvxv}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ProyectoERP23}

# Configuración del Pool de Conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ShushineHikariCP

# ------------------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# SEGURIDAD Y TOKEN JWT (CLAVE CRIPTOGRÁFICA HMAC-SHA512)
# ------------------------------------------------------------------------------
security.jwt.secret-key=${JWT_SECRET_KEY:Y/I5T3T1aSOP+BezsicbSiUtzIZWxdcOVnylSYlJl/H22uPQID8VGjfzc5U5cVhKA6qm17V2yMP/mlrlTIkb+g==}
# Expiración del access_token: 3600000 ms (1 hora)
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ------------------------------------------------------------------------------
# DOCUMENTACIÓN OPENAPI / SWAGGER UI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
